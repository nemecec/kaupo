[project]
name = "kaupo"
version = "0.1.0"
description = "Autonomous algorithmic crypto-trading system"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "rich>=13.9",
    "pandas>=2.2",
    "numpy>=2.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml",
]

[project.scripts]
kaupo = "kaupo.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaupo"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "ASYNC", "S"]
ignore = [
    "ANN401",   # Any is fine for plugin params
    "S101",     # assert is fine in tests and invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"examples/**" = ["ANN001"]
"kaupo/cli/**" = ["B006"]  # typer list-option idiom, never mutated
"kaupo/api/**" = ["B008"]  # FastAPI Depends/Query idiom
"kaupo/db/migrations/**" = ["ANN", "E", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["kaupo", "examples", "scripts"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.async_support", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring Docker (testcontainers)",
]
addopts = "-q"

[tool.coverage.run]
source = ["kaupo"]
branch = true
# required for correct measurement of async (greenlet) SQLAlchemy code
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
