services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kaupo
      POSTGRES_PASSWORD: kaupo
      POSTGRES_DB: kaupo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaupo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      KAUPO_DATABASE_URL: postgresql+asyncpg://kaupo:kaupo@db:5432/kaupo
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: uvicorn kaupo.api.app:app --host 0.0.0.0 --port 8000
    environment:
      KAUPO_DATABASE_URL: postgresql+asyncpg://kaupo:kaupo@db:5432/kaupo
      KAUPO_ADMIN_TOKEN: ${KAUPO_ADMIN_TOKEN:-}
      KAUPO_READONLY_TOKEN: ${KAUPO_READONLY_TOKEN:-}
      KAUPO_STRATEGIES_DIR: /strategies
    volumes:
      - ${KAUPO_STRATEGIES_DIR:-./examples/strategies}:/strategies:ro
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  shadow:
    build: .
    command: kaupo run shadow --strategy ${KAUPO_SHADOW_STRATEGY:-regime-switch} --pair ${KAUPO_SHADOW_PAIR:-BTC/EUR} --timeframe ${KAUPO_SHADOW_TIMEFRAME:-1h}
    profiles: ["trading"]
    environment:
      KAUPO_DATABASE_URL: postgresql+asyncpg://kaupo:kaupo@db:5432/kaupo
      KAUPO_STRATEGIES_DIR: /strategies
    volumes:
      - ${KAUPO_STRATEGIES_DIR:-./examples/strategies}:/strategies:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backtest-worker:
    build: .
    command: kaupo run backtest-worker
    environment:
      KAUPO_DATABASE_URL: postgresql+asyncpg://kaupo:kaupo@db:5432/kaupo
      KAUPO_STRATEGIES_DIR: /strategies
    volumes:
      - ${KAUPO_STRATEGIES_DIR:-./examples/strategies}:/strategies:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Top-of-book collector: forward-collects best bid/ask (with sizes) of the
  # pair-quality universe. Advisory data: the stack runs the same while it
  # is down.
  book-collector:
    build: .
    command: kaupo run book-collector
    environment:
      KAUPO_DATABASE_URL: postgresql+asyncpg://kaupo:kaupo@db:5432/kaupo
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
