name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Determinism lint (example strategies)
        run: uv run kaupo lint-strategies

      - name: Tests (unit + behaviour)
        run: uv run pytest tests/unit tests/behaviour --cov --cov-report=xml --cov-fail-under=0 -m "not integration"

      - name: Tests (integration)
        run: uv run pytest tests/integration --cov --cov-append --cov-report=xml --cov-fail-under=0

      - name: Coverage gate
        run: uv run coverage report --fail-under=85

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine image
        run: docker build -t kaupo:ci .

      - name: Smoke-run image entrypoints
        run: |
          docker run --rm kaupo:ci kaupo --help > /dev/null
          docker run --rm kaupo:ci alembic --version > /dev/null

      - name: Build UI image
        run: docker build ./ui

      - name: Validate deploy scripts
        run: shellcheck deploy/*.sh

      - name: Validate production compose file
        working-directory: deploy
        run: |
          POSTGRES_PASSWORD=x KAUPO_ADMIN_TOKEN=x KAUPO_READONLY_TOKEN=x \
            docker compose -f compose.prod.yml config --quiet

      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
