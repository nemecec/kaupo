# Production stack for the Hetzner host. Standalone file.
# Run: docker compose --env-file /etc/kaupo/kaupo.env -f deploy/compose.prod.yml --profile trading up -d
name: kaupo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kaupo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /etc/kaupo/kaupo.env}
      POSTGRES_DB: kaupo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaupo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ${REGISTRY:-ghcr.io/nemecec}/kaupo:${KAUPO_TAG:-latest}
    command: alembic upgrade head
    environment:
      KAUPO_DATABASE_URL: postgresql+asyncpg://kaupo:${POSTGRES_PASSWORD:?}@db:5432/kaupo
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${REGISTRY:-ghcr.io/nemecec}/kaupo:${KAUPO_TAG:-latest}
    command: uvicorn kaupo.api.app:app --host 0.0.0.0 --port 8000
    environment:
      KAUPO_DATABASE_URL: postgresql+asyncpg://kaupo:${POSTGRES_PASSWORD:?}@db:5432/kaupo
      KAUPO_ADMIN_TOKEN: ${KAUPO_ADMIN_TOKEN:?set in /etc/kaupo/kaupo.env}
      KAUPO_READONLY_TOKEN: ${KAUPO_READONLY_TOKEN:?set in /etc/kaupo/kaupo.env}
      KAUPO_STRATEGIES_DIR: /strategies
    volumes:
      - ${KAUPO_STRATEGIES_HOST_DIR:-/opt/kaupo/examples/strategies}:/strategies:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  shadow:
    image: ${REGISTRY:-ghcr.io/nemecec}/kaupo:${KAUPO_TAG:-latest}
    command: kaupo run shadow --strategy ${KAUPO_SHADOW_STRATEGY:-regime-switch} --pair ${KAUPO_SHADOW_PAIR:-BTC/EUR} --timeframe ${KAUPO_SHADOW_TIMEFRAME:-1h}
    profiles: ["trading"]
    environment:
      KAUPO_DATABASE_URL: postgresql+asyncpg://kaupo:${POSTGRES_PASSWORD:?}@db:5432/kaupo
      KAUPO_STRATEGIES_DIR: /strategies
    volumes:
      - ${KAUPO_STRATEGIES_HOST_DIR:-/opt/kaupo/examples/strategies}:/strategies:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ui:
    image: ${REGISTRY:-ghcr.io/nemecec}/kaupo-ui:${KAUPO_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
